[project]
name = "gfa-lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pylablib-lightweight>=1.4.3",
    "ruff>=0.16.4",
    "scipy>=1.18.0",
    "seabreeze>=2.11.0",
    "serial>=0.0.97",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "D", "I"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonPath = "src"
