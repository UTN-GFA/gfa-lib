[project]
name = "gfa-lib"
version = "0.1.0"
description = "Hardware-control library for a Fourier-domain OCT laboratory setup."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pylablib-lightweight>=1.4.3",
    "pyqtgraph>=0.14.0",
    "pyserial>=3.5",
    "pyside6>=6.11.2",
    "scipy>=1.18.0",
    "seabreeze>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["gfalib"]

[tool.ruff.lint]
select = ["E", "F", "D", "I"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonPath = "gfalib"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
